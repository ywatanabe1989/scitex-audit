[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-audit"
version = "0.1.7"
description = "Unified security scanning by orchestrating bandit, shellcheck, pip-audit, and GitHub alerts"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "scitex-dev>=0.11.7",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-audit[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-audit"
Repository = "https://github.com/ywatanabe1989/scitex-audit"
Issues = "https://github.com/ywatanabe1989/scitex-audit/issues"
Documentation = "https://scitex-audit.readthedocs.io"

[project.entry-points."scitex_dev.docs"]
scitex-audit = "scitex_audit"

[project.entry-points."scitex_dev.skills"]
scitex-audit = "scitex_audit"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_audit"]
# NOTE: a previous force-include entry for src/scitex_audit/_sphinx_html
# was removed because `packages = ["src/scitex_audit"]` already includes
# every file under src/scitex_audit/ (including the bundled
# _sphinx_html/ tree). The force-include duplicated each html file in
# the wheel, which hatchling now rejects:
#   ValueError: A second file is being added to the wheel archive at
#   the same path: `scitex_audit/_sphinx_html/genindex.html`.
# Sphinx HTML still ships with the wheel via the implicit package
# inclusion; see the W1 release v0.2.0 publish failure for context.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
parallel = true
source = ["scitex_audit"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
